<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" fill="none">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="cgtOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA026" />
      <stop offset="100%" stop-color="#EA7000" />
    </linearGradient>
    <linearGradient id="cgtNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D59" />
      <stop offset="100%" stop-color="#00142A" />
    </linearGradient>
    <linearGradient id="cgtTopFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FD8B00" />
    </linearGradient>
    <filter id="cgtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FD8B00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group for Logo Icon (Isometric modern logistics box with dynamic forward arrow & tracking motion) -->
  <g transform="translate(30, 20)">
    <!-- Base shadow/glow backdrop -->
    <ellipse cx="60" cy="115" rx="48" ry="8" fill="#001e3c" opacity="0.08" />

    <!-- Isometric Box Symbol -->
    <!-- Top Face (Arrow contour integrating into the box) -->
    <polygon points="60,10 105,36 60,62 15,36" fill="url(#cgtTopFacet)" />
    
    <!-- Left Face -->
    <polygon points="15,40 56,64 56,112 15,88" fill="#D96E00" />
    
    <!-- Right Face (Speed slit cutouts showing forward motion) -->
    <polygon points="64,64 105,40 105,88 64,112" fill="url(#cgtOrangeGrad)" />

    <!-- White / Light Accent Graphic Overlay: Inner Dynamic Forward Tracking Arrow -->
    <path d="M42,36 L60,25 L78,36 L60,47 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Subtle Tracking Line Cuts -->
    <line x1="60" y1="62" x2="60" y2="112" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    
    <!-- Speed Motion Trails behind/left of box -->
    <rect x="0" y="55" width="8" height="3" rx="1.5" fill="#FD8B00" opacity="0.8" />
    <rect x="-6" y="65" width="12" height="3.5" rx="1.75" fill="#FD8B00" opacity="0.6" />
    <rect x="2" y="75" width="7" height="3" rx="1.5" fill="#FD8B00" opacity="0.5" />

    <!-- GPS / Tracking Ping Dot -->
    <circle cx="95" cy="24" r="5" fill="#001E3C" />
    <circle cx="95" cy="24" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Group for Typography "CargoTrack" -->
  <g transform="translate(170, 0)">
    <!-- Main Wordmark -->
    <text x="0" y="88" font-family="'Hanken Grotesk', 'Inter', system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#001E3C">Cargo<tspan fill="#FD8B00">Track</tspan></text>

    <!-- Subtitle / Tagline -->
    <text x="3" y="116" font-family="'Hanken Grotesk', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="4.5" fill="#43474E" text-transform="uppercase">LOJİSTİK &amp; KARGO TEKNOLOJİLERİ</text>

    <!-- Accent Micro Divider Bar -->
    <rect x="3" y="126" width="46" height="3.5" rx="1.75" fill="#FD8B00" />
    <rect x="54" y="126" width="10" height="3.5" rx="1.75" fill="#001E3C" />
  </g>
</svg>